name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Goose
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o goose.tar.gz \
            https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz
          echo '06ac30284338269d3996d457412bf4f2b47c1f9a5601de65b6317187fe78d5c9  goose.tar.gz' | sha256sum --check
          tar -xzf goose.tar.gz
          echo "$RUNNER_TEMP/goose-v2026.3-linux-x64" >> "$GITHUB_PATH"
      - name: Verify metadata source
        run: |
          checksum=$(jq -er '.sha256' metadata/libphonenumber/source.json)
          printf '%s  %s\n' "$checksum" metadata/libphonenumber/PhoneNumberMetadata.xml | sha256sum --check
      - name: Test and build
        run: |
          goose run examples/basic.goose
          goose run tests/phonelib_test.goose -O0 --debug --no-bce
          goose build tests/phonelib_test.goose -O2 -o build/test-release
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/build/test-release"
